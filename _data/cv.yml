- title: Experience
  type: time_table
  contents:
    - title: PhD Student
      institution: King's College London
      location: London, UK
      year: Oct 2024 – present
      description:
        - Investigate how learned models form, align, and misuse predictive representations, with emphasis on failure modes hidden under aggregate metrics for medical image segmentation.
        - Develop testable approaches for localising shortcut reliance in biased vision models.
        - Study how demographic attributes become encoded in medical imaging models and how this affects robustness, fairness, and generalisation.
    - title: Research Engineer, Applied AI Research
      institution: GE Research / GE Healthcare
      location: Bangalore, India
      year: Oct 2020 – Jul 2024
      description:
        - Developed vision models for structural-defect detection, including the prediction of near-invisible cracks that were difficult to identify manually.
        - Built patient-level representations for longitudinal oncology records to support summarisation, family-history extraction, entity linking, structured information extraction, and clinical-trial matching.
        - Led development of an end-to-end clinical-trial matching system spanning trial ingestion, eligibility structuring, patient entity linking, and ranking.
        - Represented GE Healthcare at G20 events in India, presenting applied AI initiatives to cross-stakeholder audiences.

